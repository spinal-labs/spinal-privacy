[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "spinal-privacy"
version = "0.1.0"
description = "A learned input-embedding transform for frozen Qwen3.8-27B: training, MMLU scoring and a chosen-input attack."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
# Versions used for the reported results (Python 3.12, CUDA 13.0, one NVIDIA H200).
dependencies = [
    "torch==2.13.0",
    "transformers==5.16.1",
    "tokenizers==0.23.1",
    "accelerate==1.14.0",
    "safetensors==0.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["privacy_transform", "training", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# E741: single-letter tensor names (e, z) follow the paper's notation.
# B905: zip() strictness would change behaviour on length mismatch; lengths are checked explicitly.
ignore = ["E741", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["privacy_transform", "training", "evaluation", "common"]

[tool.ruff.format]
quote-style = "preserve"
